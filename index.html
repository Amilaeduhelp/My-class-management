<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; border-radius: 15px 15px 0 0; }
        .header h1 { font-size: 2.5em; }
        .nav-tabs { display: flex; background: #f8f9fa; border-bottom: 2px solid #dee2e6; overflow-x: auto; }
        .nav-tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; border: none; background: transparent; font-weight: 600; }
        .nav-tab.active { background: white; color: #667eea; border-bottom: 3px solid #667eea; }
        .content { padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-warning { background: #ffc107; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 4px solid #667eea; }
        .card-title { font-size: 1.2em; font-weight: 700; margin-bottom: 10px; }
        .card-info { color: #666; margin: 5px 0; }
        .btn-sm { padding: 5px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px 5px 0 0; font-size: 0.9em; }
        .btn-del { background: #dc3545; color: white; }
        .btn-edit { background: #ffc107; }
        .btn-wa { background: #25D366; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 5% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; }
        .close { float: right; font-size: 28px; cursor: pointer; }
        .notify { position: fixed; top: 20px; right: 20px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2000; max-width: 350px; }
        .pwd-box { background: #e7f3ff; padding: 10px; border-radius: 5px; font-family: monospace; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .msg-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.8em; }
            .grid { grid-template-columns: 1fr; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Class Management System</h1>
            <div id="date"></div>
        </div>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab(0)">Classes</button>
            <button class="nav-tab" onclick="showTab(1)">Passwords</button>
            <button class="nav-tab" onclick="showTab(2)">Messages</button>
            <button class="nav-tab" onclick="showTab(3)">Students</button>
            <button class="nav-tab" onclick="showTab(4)">Assignments</button>
            <button class="nav-tab" onclick="showTab(5)">Daily</button>
            <button class="nav-tab" onclick="showTab(6)">Reports</button>
            <button class="nav-tab" onclick="showTab(7)">Timetable</button>
        </div>
        
        <div class="content">
            <div id="t0" class="tab-content active">
                <h2>Add New Class</h2>
                <div class="form-group"><label>Class Name</label><input type="text" id="cname" placeholder="e.g., Grade 10 A"></div>
                <button class="btn btn-primary" onclick="addClass()">Add Class</button>
                <h2 style="margin-top:30px;">Classes</h2>
                <div class="grid" id="classList"></div>
            </div>
            
            <div id="t1" class="tab-content">
                <h2>🔐 Passwords</h2>
                <div class="form-group"><label>Class</label><select id="psel" onchange="loadPwd()"></select></div>
                <div id="psec" style="display:none;">
                    <div class="form-group"><label>Password</label><input type="text" id="pwd"></div>
                    <button class="btn btn-success" onclick="setPwd()">Set</button>
                    <button class="btn btn-warning" onclick="genPwd()">Generate</button>
                    <div id="cpwd"></div>
                </div>
            </div>
            
            <div id="t2" class="tab-content">
                <h2>📢 Messages</h2>
                <div class="form-group"><label>Class</label><select id="msel" onchange="loadMsg()"></select></div>
                <div id="msec" style="display:none;">
                    <div class="form-group"><label>Message</label><textarea id="msg" rows="4"></textarea></div>
                    <button class="btn btn-primary" onclick="sendMsg()">Send</button>
                    <h3 style="margin-top:30px;">History</h3>
                    <div class="grid" id="msgList"></div>
                </div>
            </div>
            
            <div id="t3" class="tab-content">
                <h2>Students</h2>
                <div class="form-group"><label>Class</label><select id="ssel" onchange="loadStd()"></select></div>
                <div id="ssec" style="display:none;">
                    <h3>Add Student</h3>
                    <div class="form-group"><label>Name</label><input type="text" id="sname"></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="sphone"></div>
                    <button class="btn btn-primary" onclick="addStd()">Add</button>
                    <h3 style="margin-top:30px;">Students <span id="scnt"></span></h3>
                    <div class="grid" id="stdList"></div>
                </div>
            </div>
            
            <div id="t4" class="tab-content">
                <h2>Assignments</h2>
                <div class="form-group"><label>Class</label><select id="asel"></select></div>
                <div class="form-group"><label>Title</label><input type="text" id="atitle"></div>
                <div class="form-group"><label>Description</label><textarea id="adesc" rows="3"></textarea></div>
                <div class="form-group"><label>Due</label><input type="date" id="adue"></div>
                <button class="btn btn-primary" onclick="addAsgn()">Add</button>
                <h2 style="margin-top:30px;">Assignments</h2>
                <div class="grid" id="asgnList"></div>
            </div>
            
            <div id="t5" class="tab-content">
                <h2>📝 Daily Reports</h2>
                <div class="form-group"><label>Class</label><select id="dsel"></select></div>
                <div class="form-group"><label>Subject</label><input type="text" id="dsub"></div>
                <div class="form-group"><label>Lesson</label><textarea id="dless" rows="3"></textarea></div>
                <div class="form-group"><label>Notes</label><textarea id="dnote" rows="2"></textarea></div>
                <button class="btn btn-primary" onclick="addDaily()">Save</button>
                <h2 style="margin-top:30px;">Today</h2>
                <div class="grid" id="dailyList"></div>
            </div>
            
            <div id="t6" class="tab-content">
                <h2>Reports</h2>
                <button class="btn btn-success" onclick="expAll()">📥 Export All</button>
                <button class="btn btn-info" onclick="expClass()">📄 Class Report</button>
                <button class="btn btn-info" onclick="expDaily()">📅 Daily Reports</button>
                <div id="stats" style="margin-top:20px;"></div>
            </div>
            
            <div id="t7" class="tab-content">
                <h2>📅 Class Timetable</h2>
                <iframe src="timetable.html" style="width:100%; height:calc(100vh - 300px); border:none; border-radius:10px; background:white;"></iframe>
            </div>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMod()">&times;</span>
            <h2 id="mtitle"></h2>
            <div id="mbody"></div>
            <button class="btn btn-primary" onclick="saveEdit()">Save</button>
        </div>
    </div>
    
    <div id="wamodal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMod('wa')">&times;</span>
            <h2>WhatsApp</h2>
            <textarea id="wamsg" rows="5" style="width:100%;padding:10px;"></textarea><br>
            <button class="btn btn-success" onclick="sendWA()">Open WhatsApp</button>
        </div>
    </div>
    
    <div id="notif"></div>

    <script>
        const SB = window.supabase.createClient('https://uqgzlaxsnknheoerbfus.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ');
        const PWDS = ['Cat99', 'Dog55', 'Sun33', 'Moon7', 'Star4', 'Fish8', 'Bird2', 'Tree6'];
        let CLS = [], ED = {}, WAP = '';
        
        async function loadDB() {
            try {
                const { data, error } = await SB.from('class').select('*').order('id');
                if (error) throw error;
                CLS = data || [];
                updSel();
                loadCls();
                notify('✅ Data loaded');
            } catch (e) {
                notify('❌ DB Error: ' + e.message);
            }
        }
        
        async function saveDB(id, field, val) {
            const upd = {}; upd[field] = JSON.stringify(val);
            await SB.from('class').update(upd).eq('id', id);
        }
        
        async function delDB(id) {
            await SB.from('class').delete().eq('id', id);
        }
        
        function notify(msg) {
            const id = 'n' + Date.now();
            document.getElementById('notif').innerHTML += `<div id="${id}" class="notify"><div style="display:flex;justify-content:space-between;"><strong>${msg}</strong><span style="cursor:pointer;" onclick="this.parentElement.parentElement.remove()">×</span></div></div>`;
            setTimeout(() => document.getElementById(id)?.remove(), 3000);
        }
        
        function showTab(n) {
            document.querySelectorAll('.tab-content,.nav-tab').forEach(e => e.classList.remove('active'));
            document.getElementById('t'+n).classList.add('active');
            document.querySelectorAll('.nav-tab')[n].classList.add('active');
            if (n === 6) updStats();
        }
        
        function updSel() {
            ['psel','msel','ssel','asel','dsel'].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = '<option value="">Select</option>' + CLS.map(c => `<option value="${c.id}">${c.class_name}</option>`).join('');
            });
        }
        
        async function addClass() {
            const name = document.getElementById('cname').value.trim();
            if (!name) return alert('Enter name');
            try {
                const { data } = await SB.from('class').insert([{class_name: name, passcode: '', student: '[]', tutes: '[]', d_report: '[]', message: '[]', m_report: '[]'}]).select();
                CLS.push(data[0]);
                document.getElementById('cname').value = '';
                updSel();
                loadCls();
                notify('✅ Class added');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadCls() {
            document.getElementById('classList').innerHTML = CLS.map(c => {
                const st = JSON.parse(c.student || '[]');
                return `<div class="card"><div class="card-title">${c.class_name}</div>
                    <div class="card-info">Students: ${st.length}</div>
                    <div class="card-info">Password: ${c.passcode ? '✅' : '❌'}</div>
                    <button class="btn-sm btn-edit" onclick="editCls(${c.id})">Edit</button>
                    <button class="btn-sm btn-del" onclick="delCls(${c.id})">Delete</button></div>`;
            }).join('');
        }
        
        async function delCls(id) {
            if (!confirm('Delete?')) return;
            try {
                await delDB(id);
                CLS = CLS.filter(c => c.id !== id);
                updSel();
                loadCls();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editCls(id) {
            const c = CLS.find(x => x.id === id);
            ED = { type: 'cls', id };
            document.getElementById('mtitle').textContent = 'Edit Class';
            document.getElementById('mbody').innerHTML = `<input type="text" id="ein" value="${c.class_name}" style="width:100%;padding:10px;">`;
            document.getElementById('modal').style.display = 'block';
        }
        
        function loadPwd() {
            const id = document.getElementById('psel').value;
            const sec = document.getElementById('psec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            document.getElementById('cpwd').innerHTML = c.passcode ? 
                `<div class="pwd-box"><strong>${c.passcode}</strong><button class="btn-sm btn-info" onclick="copyTxt('${c.passcode}')">📋</button></div>` :
                '<p style="color:#999;">No password</p>';
        }
        
        function genPwd() {
            document.getElementById('pwd').value = PWDS[Math.floor(Math.random() * PWDS.length)];
        }
        
        async function setPwd() {
            const id = document.getElementById('psel').value;
            const pwd = document.getElementById('pwd').value.trim();
            if (!id || !pwd) return alert('Select class & enter password');
            try {
                await SB.from('class').update({ passcode: pwd }).eq('id', id);
                CLS.find(c => c.id == id).passcode = pwd;
                document.getElementById('pwd').value = '';
                loadPwd();
                loadCls();
                notify('✅ Password set');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadMsg() {
            const id = document.getElementById('msel').value;
            const sec = document.getElementById('msec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            const msgs = JSON.parse(c.message || '[]').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById('msgList').innerHTML = msgs.length ? msgs.map(m => 
                `<div class="card"><div class="msg-box">${m.content}</div>
                <div class="card-info">📅 ${new Date(m.createdAt).toLocaleString()}</div>
                <button class="btn-sm btn-del" onclick="delMsg(${id}, '${m.createdAt}')">Delete</button></div>`
            ).join('') : '<p>No messages</p>';
        }
        
        async function sendMsg() {
            const id = document.getElementById('msel').value;
            const msg = document.getElementById('msg').value.trim();
            if (!id || !msg) return alert('Select class & type message');
            try {
                const c = CLS.find(x => x.id == id);
                const msgs = JSON.parse(c.message || '[]');
                msgs.push({ content: msg, createdAt: new Date().toISOString(), type: 'teacher' });
                await saveDB(id, 'message', msgs);
                c.message = JSON.stringify(msgs);
                document.getElementById('msg').value = '';
                loadMsg();
                notify('✅ Sent');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function delMsg(id, ts) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == id);
                const msgs = JSON.parse(c.message || '[]').filter(m => m.createdAt !== ts);
                await saveDB(id, 'message', msgs);
                c.message = JSON.stringify(msgs);
                loadMsg();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadStd() {
            const id = document.getElementById('ssel').value;
            const sec = document.getElementById('ssec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            const st = JSON.parse(c.student || '[]');
            document.getElementById('scnt').textContent = `(${st.length}/50)`;
            document.getElementById('stdList').innerHTML = st.map((s, i) => 
                `<div class="card"><div class="card-title">${s.name}</div>
                <div class="card-info">📱 ${s.phone}</div>
                <button class="btn-sm btn-wa" onclick="openWA('${s.phone}')">WhatsApp</button>
                <button class="btn-sm btn-edit" onclick="editStd(${id}, ${i})">Edit</button>
                <button class="btn-sm btn-del" onclick="delStd(${id}, ${i})">Delete</button></div>`
            ).join('');
        }
        
        async function addStd() {
            const id = document.getElementById('ssel').value;
            const name = document.getElementById('sname').value.trim();
            const phone = document.getElementById('sphone').value.trim();
            if (!id || !name || !phone) return alert('Fill all');
            try {
                const c = CLS.find(x => x.id == id);
                const st = JSON.parse(c.student || '[]');
                if (st.length >= 50) return alert('Max 50');
                st.push({ name, phone });
                await saveDB(id, 'student', st);
                c.student = JSON.stringify(st);
                document.getElementById('sname').value = '';
                document.getElementById('sphone').value = '';
                loadStd();
                loadCls();
                notify('✅ Added');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function delStd(id, i) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == id);
                const st = JSON.parse(c.student || '[]');
                st.splice(i, 1);
                await saveDB(id, 'student', st);
                c.student = JSON.stringify(st);
                loadStd();
                loadCls();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editStd(id, i) {
            const c = CLS.find(x => x.id == id);
            const s = JSON.parse(c.student || '[]')[i];
            ED = { type: 'std', id, i };
            document.getElementById('mtitle').textContent = 'Edit Student';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${s.name}" style="width:100%;padding:10px;margin-bottom:10px;">
                <input type="tel" id="ein2" value="${s.phone}" style="width:100%;padding:10px;">`;
            document.getElementById('modal').style.display = 'block';
        }
        
        async function addAsgn() {
            const id = document.getElementById('asel').value;
            const title = document.getElementById('atitle').value.trim();
            const desc = document.getElementById('adesc').value.trim();
            const due = document.getElementById('adue').value;
            if (!id || !title || !due) return alert('Fill required');
            try {
                const c = CLS.find(x => x.id == id);
                const as = JSON.parse(c.tutes || '[]');
                as.push({ id: Date.now(), title, description: desc, dueDate: due });
                await saveDB(id, 'tutes', as);
                c.tutes = JSON.stringify(as);
                document.getElementById('atitle').value = '';
                document.getElementById('adesc').value = '';
                document.getElementById('adue').value = '';
                loadAsgn();
                notify('✅ Added');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadAsgn() {
            document.getElementById('asgnList').innerHTML = CLS.flatMap(c => {
                const as = JSON.parse(c.tutes || '[]');
                return as.map(a => 
                    `<div class="card"><div class="card-title">${a.title}</div>
                    <div class="card-info">Class: ${c.class_name}</div>
                    <div class="card-info">Due: ${a.dueDate}</div>
                    <div class="card-info">${a.description||''}</div>
                    <button class="btn-sm btn-edit" onclick="editAsgn(${c.id}, ${a.id})">Edit</button>
                    <button class="btn-sm btn-del" onclick="delAsgn(${c.id}, ${a.id})">Delete</button></div>`
                );
            }).join('');
        }
        
        async function delAsgn(cid, aid) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == cid);
                const as = JSON.parse(c.tutes || '[]').filter(a => a.id !== aid);
                await saveDB(cid, 'tutes', as);
                c.tutes = JSON.stringify(as);
                loadAsgn();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editAsgn(cid, aid) {
            const c = CLS.find(x => x.id == cid);
            const a = JSON.parse(c.tutes || '[]').find(x => x.id === aid);
            ED = { type: 'asgn', cid, aid };
            document.getElementById('mtitle').textContent = 'Edit Assignment';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${a.title}" style="width:100%;padding:10px;margin-bottom:10px;">
                <textarea id="ein2" rows="3" style="width:100%;padding:10px;margin-bottom:10px;">${a.description||''}</textarea>
                <input type="date" id="ein3" value="${a.dueDate}" style="width:100%;padding:10px;">`;
            document.getElementById('modal').style.display = 'block';
        }
        
        async function addDaily() {
            const id = document.getElementById('dsel').value;
            const sub = document.getElementById('dsub').value.trim();
            const less = document.getElementById('dless').value.trim();
            const note = document.getElementById('dnote').value.trim();
            if (!id || !sub || !less) return alert('Fill required');
            try {
                const c = CLS.find(x => x.id == id);
                const dr = JSON.parse(c.d_report || '[]');
                dr.push({ id: Date.now(), subject: sub, lesson: less, notes: note, date: new Date().toISOString().split('T')[0] });
                await saveDB(id, 'd_report', dr);
                c.d_report = JSON.stringify(dr);
                document.getElementById('dsub').value = '';
                document.getElementById('dless').value = '';
                document.getElementById('dnote').value = '';
                loadDaily();
                notify('✅ Saved');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadDaily() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dailyList').innerHTML = CLS.flatMap(c => {
                const dr = JSON.parse(c.d_report || '[]').filter(r => r.date === today);
                return dr.map(r => 
                    `<div class="card"><div class="card-title">${c.class_name} - ${r.subject}</div>
                    <div class="card-info"><strong>Lesson:</strong> ${r.lesson}</div>
                    ${r.notes ? `<div class="card-info"><strong>Notes:</strong> ${r.notes}</div>` : ''}
                    <button class="btn-sm btn-edit" onclick="editDaily(${c.id}, ${r.id})">Edit</button>
                    <button class="btn-sm btn-del" onclick="delDaily(${c.id}, ${r.id})">Delete</button></div>`
                );
            }).join('') || '<p>No reports today</p>';
        }
        
        async function delDaily(cid, rid) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == cid);
                const dr = JSON.parse(c.d_report || '[]').filter(r => r.id !== rid);
                await saveDB(cid, 'd_report', dr);
                c.d_report = JSON.stringify(dr);
                loadDaily();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editDaily(cid, rid) {
            const c = CLS.find(x => x.id == cid);
            const r = JSON.parse(c.d_report || '[]').find(x => x.id === rid);
            ED = { type: 'daily', cid, rid };
            document.getElementById('mtitle').textContent = 'Edit Report';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${r.subject}" style="width:100%;padding:10px;margin-bottom:10px;">
                <textarea id="ein2" rows="3" style="width:100%;padding:10px;margin-bottom:10px;">${r.lesson}</textarea>
                <textarea id="ein3" rows="2" style="width:100%;padding:10px;">${r.notes||''}</textarea>`;
            document.getElementById('modal').style.display = 'block';
        }
        
        function loadPwd() {
            const id = document.getElementById('psel').value;
            const sec = document.getElementById('psec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            document.getElementById('cpwd').innerHTML = c.passcode ? 
                `<div class="pwd-box"><strong>${c.passcode}</strong><button class="btn-sm btn-info" onclick="copyTxt('${c.passcode}')">📋</button></div>` :
                '<p style="color:#999;">No password</p>';
        }
        
        function genPwd() {
            document.getElementById('pwd').value = PWDS[Math.floor(Math.random() * PWDS.length)];
        }
        
        async function setPwd() {
            const id = document.getElementById('psel').value;
            const pwd = document.getElementById('pwd').value.trim();
            if (!id || !pwd) return alert('Select class & enter password');
            try {
                await SB.from('class').update({ passcode: pwd }).eq('id', id);
                CLS.find(c => c.id == id).passcode = pwd;
                document.getElementById('pwd').value = '';
                loadPwd();
                loadCls();
                notify('✅ Password set');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadMsg() {
            const id = document.getElementById('msel').value;
            const sec = document.getElementById('msec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            const msgs = JSON.parse(c.message || '[]').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById('msgList').innerHTML = msgs.length ? msgs.map(m => 
                `<div class="card"><div class="msg-box">${m.content}</div>
                <div class="card-info">📅 ${new Date(m.createdAt).toLocaleString()}</div>
                <button class="btn-sm btn-del" onclick="delMsg(${id}, '${m.createdAt}')">Delete</button></div>`
            ).join('') : '<p>No messages</p>';
        }
        
        async function sendMsg() {
            const id = document.getElementById('msel').value;
            const msg = document.getElementById('msg').value.trim();
            if (!id || !msg) return alert('Select class & type message');
            try {
                const c = CLS.find(x => x.id == id);
                const msgs = JSON.parse(c.message || '[]');
                msgs.push({ content: msg, createdAt: new Date().toISOString(), type: 'teacher' });
                await saveDB(id, 'message', msgs);
                c.message = JSON.stringify(msgs);
                document.getElementById('msg').value = '';
                loadMsg();
                notify('✅ Sent');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function delMsg(id, ts) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == id);
                const msgs = JSON.parse(c.message || '[]').filter(m => m.createdAt !== ts);
                await saveDB(id, 'message', msgs);
                c.message = JSON.stringify(msgs);
                loadMsg();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadStd() {
            const id = document.getElementById('ssel').value;
            const sec = document.getElementById('ssec');
            if (!id) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            const c = CLS.find(x => x.id == id);
            const st = JSON.parse(c.student || '[]');
            document.getElementById('scnt').textContent = `(${st.length}/50)`;
            document.getElementById('stdList').innerHTML = st.map((s, i) => 
                `<div class="card"><div class="card-title">${s.name}</div>
                <div class="card-info">📱 ${s.phone}</div>
                <button class="btn-sm btn-wa" onclick="openWA('${s.phone}')">WhatsApp</button>
                <button class="btn-sm btn-edit" onclick="editStd(${id}, ${i})">Edit</button>
                <button class="btn-sm btn-del" onclick="delStd(${id}, ${i})">Delete</button></div>`
            ).join('');
        }
        
        async function addStd() {
            const id = document.getElementById('ssel').value;
            const name = document.getElementById('sname').value.trim();
            const phone = document.getElementById('sphone').value.trim();
            if (!id || !name || !phone) return alert('Fill all');
            try {
                const c = CLS.find(x => x.id == id);
                const st = JSON.parse(c.student || '[]');
                if (st.length >= 50) return alert('Max 50');
                st.push({ name, phone });
                await saveDB(id, 'student', st);
                c.student = JSON.stringify(st);
                document.getElementById('sname').value = '';
                document.getElementById('sphone').value = '';
                loadStd();
                loadCls();
                notify('✅ Added');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function delStd(id, i) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == id);
                const st = JSON.parse(c.student || '[]');
                st.splice(i, 1);
                await saveDB(id, 'student', st);
                c.student = JSON.stringify(st);
                loadStd();
                loadCls();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editStd(id, i) {
            const c = CLS.find(x => x.id == id);
            const s = JSON.parse(c.student || '[]')[i];
            ED = { type: 'std', id, i };
            document.getElementById('mtitle').textContent = 'Edit Student';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${s.name}" style="width:100%;padding:10px;margin-bottom:10px;">
                <input type="tel" id="ein2" value="${s.phone}" style="width:100%;padding:10px;">`;
            document.getElementById('modal').style.display = 'block';
        }
        
        async function addAsgn() {
            const id = document.getElementById('asel').value;
            const title = document.getElementById('atitle').value.trim();
            const desc = document.getElementById('adesc').value.trim();
            const due = document.getElementById('adue').value;
            if (!id || !title || !due) return alert('Fill required');
            try {
                const c = CLS.find(x => x.id == id);
                const as = JSON.parse(c.tutes || '[]');
                as.push({ id: Date.now(), title, description: desc, dueDate: due });
                await saveDB(id, 'tutes', as);
                c.tutes = JSON.stringify(as);
                document.getElementById('atitle').value = '';
                document.getElementById('adesc').value = '';
                document.getElementById('adue').value = '';
                loadAsgn();
                notify('✅ Added');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadAsgn() {
            document.getElementById('asgnList').innerHTML = CLS.flatMap(c => {
                const as = JSON.parse(c.tutes || '[]');
                return as.map(a => 
                    `<div class="card"><div class="card-title">${a.title}</div>
                    <div class="card-info">Class: ${c.class_name}</div>
                    <div class="card-info">Due: ${a.dueDate}</div>
                    <div class="card-info">${a.description||''}</div>
                    <button class="btn-sm btn-edit" onclick="editAsgn(${c.id}, ${a.id})">Edit</button>
                    <button class="btn-sm btn-del" onclick="delAsgn(${c.id}, ${a.id})">Delete</button></div>`
                );
            }).join('');
        }
        
        async function delAsgn(cid, aid) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == cid);
                const as = JSON.parse(c.tutes || '[]').filter(a => a.id !== aid);
                await saveDB(cid, 'tutes', as);
                c.tutes = JSON.stringify(as);
                loadAsgn();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editAsgn(cid, aid) {
            const c = CLS.find(x => x.id == cid);
            const a = JSON.parse(c.tutes || '[]').find(x => x.id === aid);
            ED = { type: 'asgn', cid, aid };
            document.getElementById('mtitle').textContent = 'Edit Assignment';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${a.title}" style="width:100%;padding:10px;margin-bottom:10px;">
                <textarea id="ein2" rows="3" style="width:100%;padding:10px;margin-bottom:10px;">${a.description||''}</textarea>
                <input type="date" id="ein3" value="${a.dueDate}" style="width:100%;padding:10px;">`;
            document.getElementById('modal').style.display = 'block';
        }
        
        async function addDaily() {
            const id = document.getElementById('dsel').value;
            const sub = document.getElementById('dsub').value.trim();
            const less = document.getElementById('dless').value.trim();
            const note = document.getElementById('dnote').value.trim();
            if (!id || !sub || !less) return alert('Fill required');
            try {
                const c = CLS.find(x => x.id == id);
                const dr = JSON.parse(c.d_report || '[]');
                dr.push({ id: Date.now(), subject: sub, lesson: less, notes: note, date: new Date().toISOString().split('T')[0] });
                await saveDB(id, 'd_report', dr);
                c.d_report = JSON.stringify(dr);
                document.getElementById('dsub').value = '';
                document.getElementById('dless').value = '';
                document.getElementById('dnote').value = '';
                loadDaily();
                notify('✅ Saved');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function loadDaily() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dailyList').innerHTML = CLS.flatMap(c => {
                const dr = JSON.parse(c.d_report || '[]').filter(r => r.date === today);
                return dr.map(r => 
                    `<div class="card"><div class="card-title">${c.class_name} - ${r.subject}</div>
                    <div class="card-info"><strong>Lesson:</strong> ${r.lesson}</div>
                    ${r.notes ? `<div class="card-info"><strong>Notes:</strong> ${r.notes}</div>` : ''}
                    <button class="btn-sm btn-edit" onclick="editDaily(${c.id}, ${r.id})">Edit</button>
                    <button class="btn-sm btn-del" onclick="delDaily(${c.id}, ${r.id})">Delete</button></div>`
                );
            }).join('') || '<p>No reports today</p>';
        }
        
        async function delDaily(cid, rid) {
            if (!confirm('Delete?')) return;
            try {
                const c = CLS.find(x => x.id == cid);
                const dr = JSON.parse(c.d_report || '[]').filter(r => r.id !== rid);
                await saveDB(cid, 'd_report', dr);
                c.d_report = JSON.stringify(dr);
                loadDaily();
                notify('✅ Deleted');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function editDaily(cid, rid) {
            const c = CLS.find(x => x.id == cid);
            const r = JSON.parse(c.d_report || '[]').find(x => x.id === rid);
            ED = { type: 'daily', cid, rid };
            document.getElementById('mtitle').textContent = 'Edit Report';
            document.getElementById('mbody').innerHTML = 
                `<input type="text" id="ein1" value="${r.subject}" style="width:100%;padding:10px;margin-bottom:10px;">
                <textarea id="ein2" rows="3" style="width:100%;padding:10px;margin-bottom:10px;">${r.lesson}</textarea>
                <textarea id="ein3" rows="2" style="width:100%;padding:10px;">${r.notes||''}</textarea>`;
            document.getElementById('modal').style.display = 'block';
        }
		 async function saveEdit() {
            try {
                if (ED.type === 'cls') {
                    const name = document.getElementById('ein').value.trim();
                    if (!name) return alert('Enter name');
                    await SB.from('class').update({ class_name: name }).eq('id', ED.id);
                    CLS.find(c => c.id === ED.id).class_name = name;
                    loadCls();
                    notify('✅ Updated');
                } else if (ED.type === 'std') {
                    const name = document.getElementById('ein1').value.trim();
                    const phone = document.getElementById('ein2').value.trim();
                    if (!name || !phone) return alert('Fill all');
                    const c = CLS.find(x => x.id == ED.id);
                    const st = JSON.parse(c.student || '[]');
                    st[ED.i] = { name, phone };
                    await saveDB(ED.id, 'student', st);
                    c.student = JSON.stringify(st);
                    loadStd();
                    notify('✅ Updated');
                } else if (ED.type === 'asgn') {
                    const title = document.getElementById('ein1').value.trim();
                    const desc = document.getElementById('ein2').value.trim();
                    const due = document.getElementById('ein3').value;
                    if (!title || !due) return alert('Fill required');
                    const c = CLS.find(x => x.id == ED.cid);
                    const as = JSON.parse(c.tutes || '[]');
                    const a = as.find(x => x.id === ED.aid);
                    a.title = title; a.description = desc; a.dueDate = due;
                    await saveDB(ED.cid, 'tutes', as);
                    c.tutes = JSON.stringify(as);
                    loadAsgn();
                    notify('✅ Updated');
                } else if (ED.type === 'daily') {
                    const sub = document.getElementById('ein1').value.trim();
                    const less = document.getElementById('ein2').value.trim();
                    const note = document.getElementById('ein3').value.trim();
                    if (!sub || !less) return alert('Fill required');
                    const c = CLS.find(x => x.id == ED.cid);
                    const dr = JSON.parse(c.d_report || '[]');
                    const r = dr.find(x => x.id === ED.rid);
                    r.subject = sub; r.lesson = less; r.notes = note;
                    await saveDB(ED.cid, 'd_report', dr);
                    c.d_report = JSON.stringify(dr);
                    loadDaily();
                    notify('✅ Updated');
                }
                closeMod();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function updStats() {
            const totStd = CLS.reduce((sum, c) => sum + JSON.parse(c.student || '[]').length, 0);
            const totAsgn = CLS.reduce((sum, c) => sum + JSON.parse(c.tutes || '[]').length, 0);
            const totRep = CLS.reduce((sum, c) => sum + JSON.parse(c.d_report || '[]').length, 0);
            document.getElementById('stats').innerHTML = 
                `<div style="background:#f8f9fa;padding:20px;border-radius:10px;">
                <h3>Statistics</h3>
                <p><strong>Classes:</strong> ${CLS.length}</p>
                <p><strong>Students:</strong> ${totStd}</p>
                <p><strong>Assignments:</strong> ${totAsgn}</p>
                <p><strong>Reports:</strong> ${totRep}</p></div>`;
        }
        
        function expAll() {
            let csv = '\ufeffClasses\nName,Students\n';
            CLS.forEach(c => {
                const st = JSON.parse(c.student || '[]');
                csv += `"${c.class_name}",${st.length}\n`;
            });
            csv += '\n\nStudents\nClass,Name,Phone\n';
            CLS.forEach(c => {
                const st = JSON.parse(c.student || '[]');
                st.forEach(s => csv += `"${c.class_name}","${s.name}","${s.phone}"\n`);
            });
            csv += '\n\nAssignments\nClass,Title,Description,Due\n';
            CLS.forEach(c => {
                const as = JSON.parse(c.tutes || '[]');
                as.forEach(a => csv += `"${c.class_name}","${a.title}","${a.description||''}","${a.dueDate}"\n`);
            });
            download(csv, 'All_Data.csv');
        }
        
        function expClass() {
            let csv = '\ufeffClass Report\nName,Students,Assignments,Reports\n';
            CLS.forEach(c => {
                const st = JSON.parse(c.student || '[]').length;
                const as = JSON.parse(c.tutes || '[]').length;
                const dr = JSON.parse(c.d_report || '[]').length;
                csv += `"${c.class_name}",${st},${as},${dr}\n`;
            });
            download(csv, 'Class_Report.csv');
        }
        
        function expDaily() {
            let csv = '\ufeffDaily Reports\nDate,Class,Subject,Lesson,Notes\n';
            CLS.forEach(c => {
                const dr = JSON.parse(c.d_report || '[]');
                dr.forEach(r => csv += `"${r.date}","${c.class_name}","${r.subject}","${r.lesson}","${r.notes||''}"\n`);
            });
            download(csv, 'Daily_Reports.csv');
        }
        
        function download(csv, name) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
            notify('✅ Exported');
        }
        
        function closeMod(type) {
            document.getElementById(type === 'wa' ? 'wamodal' : 'modal').style.display = 'none';
        }
        
        function openWA(phone) {
            WAP = phone;
            document.getElementById('wamsg').value = '';
            document.getElementById('wamodal').style.display = 'block';
        }
        
        function sendWA() {
            const msg = document.getElementById('wamsg').value.trim();
            if (!msg) return alert('Type message');
            let ph = WAP.replace(/[^0-9]/g, '');
            if (ph.startsWith('0')) ph = '94' + ph.substring(1);
            else if (!ph.startsWith('94')) ph = '94' + ph;
            window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`, '_blank');
            closeMod('wa');
        }
        
        function copyTxt(txt) {
            navigator.clipboard.writeText(txt);
            notify('✅ Copied');
        }
        
        window.onclick = e => {
            if (e.target.id === 'modal') closeMod();
            if (e.target.id === 'wamodal') closeMod('wa');
        };
        
        document.getElementById('date').textContent = new Date().toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        
        loadDB();
        loadAsgn();
        loadDaily();
    </script>
</body>
</html>
